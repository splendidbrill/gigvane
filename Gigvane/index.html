<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gigvane — Buy the outcome. Skip the freelancer.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans:  ['Geist','ui-sans-serif','system-ui','-apple-system','sans-serif'],
          mono:  ['"Geist Mono"','ui-monospace','SFMono-Regular','Menlo','monospace'],
          serif: ['"Instrument Serif"','ui-serif','Georgia','serif'],
        },
        colors: {
          bone:     '#F4F1E8',
          bonesoft: '#EFEBDE',
          paper:    '#FBF9F2',
          hairline: '#E5E1D4',
          hairmid:  '#D6D1BF',
          slate:    '#6B695F',
          ink:      '#0E0E10',
          ink2:     '#16161A',
          voltage:  '#CFF24E',
          voltsoft: '#E5F596',
          oxblood:  '#7A2A23',
        }
      }
    }
  }
</script>

<style>
  :root{
    --bone:#F4F1E8; --paper:#FBF9F2; --hair:#E5E1D4; --hairmid:#D6D1BF;
    --ink:#0E0E10; --ink2:#16161A; --slate:#6B695F; --voltage:#CFF24E;
  }
  html,body{background:var(--bone);color:var(--ink);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{font-feature-settings:"ss01","cv11"}
  ::selection{background:#CFF24E;color:#0E0E10}

  /* Editorial display tracking */
  .tk-tight{ letter-spacing:-0.04em }
  .tk-tighter{ letter-spacing:-0.055em }
  .tk-tightest{ letter-spacing:-0.07em }

  /* Card depth — vercel-influenced stacked hairline + soft glow */
  .card-bone{
    background:var(--paper);
    border:1px solid var(--hair);
    border-radius:16px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 1px 1px rgba(14,14,16,.02),
      0 2px 2px rgba(14,14,16,.025),
      0 6px 14px rgba(14,14,16,.035);
  }
  .card-ink{
    background:linear-gradient(180deg,#17171b 0%,#0E0E10 100%);
    border:1px solid #2a2a30;
    border-radius:16px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.05) inset,
      0 12px 40px rgba(0,0,0,.35);
  }
  .hair-bg{
    background-image:
      linear-gradient(to right, rgba(14,14,16,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(14,14,16,.045) 1px, transparent 1px);
    background-size:56px 56px;
  }

  /* Primary CTA - ink pill, vercel/lovable hybrid inset */
  .btn-ink{
    background:#0E0E10; color:#F4F1E8;
    padding:10px 18px; border-radius:9999px;
    font-weight:500; font-size:14px;
    box-shadow:
      rgba(255,255,255,.18) 0 0.5px 0 0 inset,
      rgba(255,255,255,.05) 0 -1px 0 0 inset,
      rgba(0,0,0,.18) 0 0 0 0.5px inset,
      rgba(0,0,0,.08) 0 1px 2px 0,
      rgba(0,0,0,.06) 0 6px 18px -6px;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
    cursor:default;
  }
  .btn-ink:hover{ transform:translateY(-0.5px); box-shadow:
      rgba(255,255,255,.22) 0 0.5px 0 0 inset,
      rgba(255,255,255,.05) 0 -1px 0 0 inset,
      rgba(0,0,0,.18) 0 0 0 0.5px inset,
      rgba(0,0,0,.1) 0 2px 3px 0,
      rgba(0,0,0,.1) 0 10px 28px -6px;}
  .btn-ink:active{ transform:translateY(0); opacity:.92}

  .btn-volt{
    background:#CFF24E; color:#0E0E10;
    padding:10px 18px; border-radius:9999px;
    font-weight:600; font-size:14px;
    box-shadow:
      rgba(255,255,255,.4) 0 0.5px 0 0 inset,
      rgba(0,0,0,.18) 0 0 0 0.5px inset,
      rgba(95,114,30,.25) 0 6px 18px -4px;
    transition: transform .15s ease, box-shadow .15s ease;
    cursor:default;
  }
  .btn-volt:hover{ transform:translateY(-0.5px); }

  .btn-ghost{
    background:transparent; color:#0E0E10;
    padding:10px 16px; border-radius:9999px;
    font-weight:500; font-size:14px;
    border:1px solid rgba(14,14,16,.18);
    transition: background .15s ease;
    cursor:default;
  }
  .btn-ghost:hover{ background:rgba(14,14,16,.04); }

  /* Mono labels / eyebrows */
  .eyebrow{
    font-family:'Geist Mono', ui-monospace, monospace;
    font-size:11px; font-weight:500; letter-spacing:.04em;
    text-transform:uppercase; color:var(--slate);
  }
  .chip-mono{
    font-family:'Geist Mono', ui-monospace, monospace;
    font-size:11px; letter-spacing:.02em;
    padding:3px 8px; border-radius:9999px;
    background:rgba(14,14,16,.04); border:1px solid var(--hair);
    color:#1a1a1c; white-space:nowrap;
  }
  .chip-volt{
    font-family:'Geist Mono', ui-monospace, monospace;
    font-size:11px; letter-spacing:.02em; font-weight:500;
    padding:3px 8px; border-radius:9999px;
    background:#CFF24E; color:#0E0E10;
    border:1px solid rgba(14,14,16,.18);
  }
  .chip-ink{
    font-family:'Geist Mono', ui-monospace, monospace;
    font-size:11px; letter-spacing:.02em;
    padding:3px 8px; border-radius:9999px;
    background:#0E0E10; color:#F4F1E8;
    border:1px solid rgba(14,14,16,.4);
  }

  /* Status dot */
  .pulse-volt{
    position:relative; width:8px; height:8px; border-radius:9999px;
    background:#CFF24E; box-shadow:0 0 0 0 rgba(207,242,78,.6);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(207,242,78,.55)} 70%{box-shadow:0 0 0 8px rgba(207,242,78,0)} 100%{box-shadow:0 0 0 0 rgba(207,242,78,0)} }

  /* Caret */
  .caret{ display:inline-block; width:1.5px; height:1em; background:#0E0E10; vertical-align:-2px; margin-left:1px; animation:blink 1.05s steps(1) infinite}
  .caret-bone{ background:#F4F1E8 }
  @keyframes blink{ 50%{opacity:0} }

  /* Section divider */
  .section-rule{
    height:1px; width:100%;
    background:linear-gradient(90deg, transparent 0%, var(--hair) 18%, var(--hair) 82%, transparent 100%);
  }

  /* SOW skeleton in -> appear */
  @keyframes rise{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .rise{ animation: rise .55s cubic-bezier(.2,.6,.2,1) both }

  /* Subtle background grain on hero */
  .grain{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.35;
    background-image: radial-gradient(rgba(14,14,16,.08) 1px, transparent 1px);
    background-size: 3px 3px;
    mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 70%);
  }

  /* Smooth scroll for anchor */
  html{ scroll-behavior:smooth }

  /* Hide spin */
  input[type=email]{ font-family:inherit }

  /* Marquee for clients */
  @keyframes marq{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .marquee-track{ animation: marq 40s linear infinite }

  /* For the comparison row hover */
  .compare-row{ transition: background .2s ease }
  .compare-row:hover{ background: rgba(14,14,16,.02) }

  /* Voltage underline */
  .volt-under{ background-image: linear-gradient(180deg, transparent 60%, #CFF24E 60%, #CFF24E 92%, transparent 92%); background-repeat:no-repeat }

  /* Number ticker */
  .tnum{ font-variant-numeric: tabular-nums }
</style>
</head>
<body class="antialiased">

<div id="root"></div>

</body>
